{% extends "layouts/dashboard_base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="card shadow-lg border-0">
    <div class="card-header bg-warning text-dark">
        <h3>
            <i class="bi bi-pencil-square"></i>
            Edit Trek
        </h3>
        <small>Update the trek information.</small>
    </div>

    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Trek Title</label>
                    <input type="text" name="title" class="form-control"
                        value="{{ trek.title }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control"
                        value="{{ trek.location }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-select">
                        <option value="Easy"
                        {% if trek.difficulty=="Easy" %}selected{% endif %}>
                        Easy
                        </option>

                        <option value="Moderate"
                        {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                        Moderate
                        </option>

                        <option value="Hard"
                        {% if trek.difficulty=="Hard" %}selected{% endif %}>
                        Hard
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Price</label>

                    <input type="number" name="price" class="form-control"
                        value="{{ trek.price }}" required>

                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Capacity</label>
                    <input type="number" name="capacity" class="form-control"
                        value="{{ trek.capacity }}" required>

                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>

                    <input type="date" name="start_date" class="form-control"
                        value="{{ trek.start_date }}" required>

                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control"
                        value="{{ trek.end_date }}" required>

                </div>
                <div class="col-12 mb-4">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea rows="5" name="description"
                        class="form-control">{{ trek.description }}</textarea>

                </div>

            </div>

            <button class="btn btn-warning">
                <i class="bi bi-check-circle"></i>
                Update Trek
            </button>

            <a href="/my-treks"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
