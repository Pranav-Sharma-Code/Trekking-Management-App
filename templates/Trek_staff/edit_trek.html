{% extends "layouts/dashboard_base.html" %}

{% block title %}
Update Trek
{% endblock %}

{% block content %}

<div class="container-fluid">
    <div class="mb-4">
        <h2 class="fw-bold">✏️ Update Trek</h2>
        <p class="text-muted">
            Update trek availability and status
        </p>
    </div>

    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">{{ trek.title }}</h4>
        </div>

        <div class="card-body">
            <!-- Trek Information -->

            <div class="row mb-4">
                <div class="col-md-6">
                    <p>
                        <strong>Location</strong><br>
                        {{ trek.location }}
                    </p>
                </div>

                <div class="col-md-6">
                    <p>
                        <strong>Capacity</strong><br>
                        {{ trek.capacity }}
                    </p>
                </div>
            </div>


            <form method="POST">
                <!-- Available Slots -->

                <div class="mb-4">
                    <label class="form-label">Available Slots</label>

                    <input type="number" class="form-control" name="available_slots"
                        value="{{ trek.available_slots }}" min="0" max="{{ trek.capacity }}"
                        required>

                    <small class="text-muted">Maximum capacity: {{ trek.capacity }}</small>
                </div>


                <!-- Trek Status -->

                <div class="mb-4">

                    <label class="form-label">Trek Status</label>

                    <select class="form-select" name="status" required>
                        <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>
                            Open
                        </option>

                        <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>
                            Closed
                        </option>
                    </select>
                </div>


                <!-- Buttons -->

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('Trek_staff.my_treks') }}" class="btn btn-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Update Trek</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
