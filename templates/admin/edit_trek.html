{% extends "layouts/dashboard_base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container-fluid">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0">✏️ Edit Trek</h3>
        </div>

        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <!-- Trek Name -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Trek Name</label>
                        <input type="text" class="form-control" name="title" value="{{ trek.title }}" required>
                    </div>

                    <!-- State -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">State</label>
                        <input type="text" class="form-control" name="state" value="{{ trek.state }}" required>
                    </div>

                    <!-- Location -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                    </div>

                    <!-- Difficulty -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Difficulty</label>

                        <select class="form-select" name="difficulty">
                            <option value="Easy" {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>
                            <option value="Hard" {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>
                        </select>
                    </div>

                    <!-- Duration -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration (Days)</label>
                        <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
                    </div>

                    <!-- Altitude -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Altitude (Meters)</label>
                        <input type="number" class="form-control" name="altitude" value="{{ trek.altitude }}">
                    </div>

                    <!-- Registration Deadline -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Registration Deadline</label>
                        <input type="date" class="form-control" name="registration_deadline" value="{{ trek.registration_deadline }}" required>

                    </div>

                    <!-- Start Date -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}" required>
                    </div>

                    <!-- End Date -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}" required>
                    </div>

                    <!-- Capacity -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Capacity</label>
                        <input type="number" class="form-control" name="capacity" value="{{ trek.capacity }}" required>
                    </div>

                    <!-- Available Slots -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Slots</label>
                        <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots }}" required>
                    </div>

                    <!-- Price -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Price (₹)</label>
                        <input type="number" class="form-control" name="price" value="{{ trek.price }}" required>
                    </div>

                    <!-- Staff -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assign Staff</label>

                        <select class="form-select" name="organizer_id">
                            {% for member in staff %}
                            <option value="{{ member.id }}" {% if trek.organizer_id==member.id %}selected{% endif %}>
                                {{ member.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Status -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Trek Status</label>

                        <select class="form-select" name="status">
                            <option value="Pending" {% if trek.status=="Pending" %}selected{% endif %}>Pending</option>
                            <option value="Open" {% if trek.status=="Open" %}selected{% endif %}>Open</option>
                            <option value="Closed" {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                    <!-- Image URL -->

                    <div class="col-12 mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="text" class="form-control" name="image" value="{{ trek.image }}">
                    </div>

                    <!-- Description -->

                    <div class="col-12 mb-4">
                        <label class="form-label">Description</label>
                        <textarea rows="6" class="form-control" name="description">{{ trek.description }}</textarea>
                    </div>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Back</a>
                    <button class="btn btn-warning">Update Trek</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
