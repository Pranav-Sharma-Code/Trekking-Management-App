{% extends "layouts/dashboard_base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2 class="fw-bold">My Profile</h2>

        <p class="text-muted">
            View and update your profile information.
        </p>
    </div>
    <div class="row">

        <!-- Profile Card -->

        <div class="col-lg-4">
            <div class="card shadow border-0">
                <div class="card-body text-center">

                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                        width="120"
                        class="rounded-circle mb-3">

                    <h4>{{ user.name }}</h4>

                    <span class="badge bg-primary">
                        {{ user.role }}
                    </span>

                    <hr>

                    <p>
                        <strong>Email</strong><br>
                        {{ user.email }}
                    </p>

                    <p>
                        <strong>Phone</strong><br>
                        {{ user.phone }}
                    </p>
                </div>
            </div>
        </div>


        <!-- Update Form -->

        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Update Profile</h5>

                </div>

                <div class="card-body">
                    <form method="POST"
                        action="{{ url_for('participant.update_profile') }}">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ user.name }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>

                            <input
                                type="email"
                                class="form-control"
                                value="{{ user.email }}"
                                readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ user.phone }}"
                                required>
                        </div>

                        <button class="btn btn-primary">
                            Update Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
